<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#073b78">
<title>ACTIVE TALK – Flashcards Unit 1 - 4</title>
<style>
:root{
  --blue:#073b78;
  --blue-light:#1763b1;
  --red:#d62828;
  --green:#16a34a;
  --ink:#172033;
  --muted:#64748b;
  --line:#dbe3ee;
  --soft:#f1f5f9;
  --bg:#f4f7fb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100dvh;
  overflow-x:hidden;
}
.app{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  min-height:100dvh;
}
header{text-align:center;margin-bottom:12px}
h1{font-size:22px;letter-spacing:1.2px;color:var(--blue);margin:2px 0 4px;font-weight:800}
.sub{color:var(--muted);font-size:13px}

/* Thanh công cụ gọn cho mobile */
.toolbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
  margin-bottom:12px;
}
.toolbar select,.toolbar button{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  background:#fff;
  color:var(--blue);
  font-weight:700;
  font-size:13.5px;
  cursor:pointer;
  min-height:42px;
}
.toolbar select{width:100%;text-overflow:ellipsis}
.toolbar button:active{background:var(--soft);transform:scale(.97)}

/* Thanh tiến độ */
.progress{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:12.5px;
  font-weight:600;
  margin-bottom:6px;
  padding:0 2px;
}
.counter{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:800}
.track{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar{height:100%;width:0;background:var(--blue-light);transition:width .25s ease}

/* Thẻ Flashcard tối ưu chạm & vuốt */
.card-wrap{perspective:1200px;width:100%;touch-action:pan-y}
.card{
  min-height:240px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.22,1,.36,1);
  cursor:pointer;
  outline:none;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  box-shadow:0 8px 24px rgba(15,35,65,.07);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:38px 20px 32px;
}
.face.back{transform:rotateY(180deg)}
.tag{
  position:absolute;
  top:14px;
  left:16px;
  font-size:11px;
  letter-spacing:.5px;
  color:var(--muted);
  font-weight:700;
  text-transform:uppercase;
}
.hint{
  position:absolute;
  top:14px;
  right:16px;
  color:#94a3b8;
  font-size:11px;
  font-weight:600;
}
.vietnamese,.english{
  font-size:clamp(20px,5.2vw,26px);
  line-height:1.45;
  font-weight:700;
  color:var(--blue);
  overflow-wrap:anywhere;
}
.ipa{
  font-size:clamp(16px,4.4vw,21px);
  line-height:1.45;
  color:var(--red);
  margin-top:12px;
  overflow-wrap:anywhere;
}
.flip-note{
  position:absolute;
  bottom:12px;
  color:#94a3b8;
  font-size:11.5px;
}

/* Khung gõ kiểm tra đáp án Mobile-Friendly */
.practice-box{
  margin-top:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
  box-shadow:0 4px 16px rgba(15,35,65,.04);
}
.input-group{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.input-group textarea{
  width:100%;
  min-height:54px;
  max-height:120px;
  padding:12px 14px;
  font-size:16px; /* Chuẩn 16px chống auto-zoom trên iPhone */
  line-height:1.4;
  font-family:inherit;
  border:2px solid var(--line);
  border-radius:12px;
  outline:none;
  color:var(--ink);
  background:#f8fafc;
  resize:none;
  transition:border-color .2s, background .2s;
}
.input-group textarea:focus{
  border-color:var(--blue-light);
  background:#fff;
}
.input-group textarea.is-correct{
  border-color:var(--green);
  background:#f0fdf4;
}
.input-group textarea.is-wrong{
  border-color:var(--red);
  background:#fef2f2;
}
.check-btn{
  width:100%;
  min-height:46px;
  border:0;
  border-radius:12px;
  background:var(--blue-light);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.check-btn:active{background:var(--blue);transform:scale(.99)}

.feedback{
  margin-top:8px;
  font-size:14px;
  font-weight:600;
  line-height:1.45;
  display:none;
  padding:8px 10px;
  border-radius:10px;
}
.feedback.ok{display:block;color:var(--green);background:#f0fdf4}
.feedback.err{display:block;color:var(--red);background:#fef2f2}

/* Thanh điều hướng ngón cái phía dưới */
.nav{
  display:grid;
  grid-template-columns:1fr 1.3fr 1fr;
  gap:10px;
  margin-top:14px;
}
.nav button{
  min-height:48px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--blue);
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}
.nav button:active{background:var(--soft);transform:scale(.97)}
.nav .primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}
.nav .primary:active{background:#0b4d96}

.gesture-tip{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  margin-top:12px;
}

/* Tối ưu riêng cho màn hình lớn (PC/Tablet) */
@media(min-width:600px){
  .app{padding:28px 20px}
  h1{font-size:30px}
  .card{min-height:290px}
  .input-group{flex-direction:row;align-items:stretch}
  .input-group textarea{min-height:48px}
  .check-btn{width:auto;min-width:120px}
}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>ACTIVE TALK</h1>
    <div class="sub">Flashcards luyện nói & gõ câu · Unit 1 – 4 (107 thẻ)</div>
  </header>

  <div class="toolbar">
    <select id="unitFilter" aria-label="Chọn bài học">
      <option value="all">Tất cả (Unit 1 – 4)</option>
      <option value="Unit 1">Unit 1 · 26 thẻ</option>
      <option value="Unit 2">Unit 2 · 16 thẻ</option>
      <option value="UNIT 3: FROM MORNING TO NOON">Unit 3 · 32 thẻ</option>
      <option value="UNIT 4: FROM NOON TO NIGHT">Unit 4 · 33 thẻ</option>
    </select>
    <button id="shuffle" title="Trộn ngẫu nhiên">Trộn</button>
    <button id="reset" title="Quay lại từ đầu">Đặt lại</button>
  </div>

  <div class="progress">
    <span id="unitLabel">Unit 1</span>
    <span class="counter" id="counter">1 / 107</span>
  </div>
  <div class="track"><div class="bar" id="bar"></div></div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Lật flashcard">
      <section class="face front">
        <span class="tag">TIẾNG VIỆT</span>
        <span class="hint">MẶT TRƯỚC</span>
        <div class="vietnamese" id="vi"></div>
        <div class="flip-note">Chạm thẻ để lật · Vuốt trái/phải để chuyển</div>
      </section>
      <section class="face back">
        <span class="tag">ENGLISH + IPA</span>
        <span class="hint">MẶT SAU</span>
        <div class="english" id="en"></div>
        <div class="ipa" id="ipa"></div>
        <div class="flip-note">Chạm thẻ để quay lại mặt trước</div>
      </section>
    </div>
  </div>

  <div class="practice-box">
    <div class="input-group">
      <textarea id="answerInput" rows="1" placeholder="Gõ câu tiếng Anh tại đây..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <button class="check-btn" id="checkBtn">Kiểm tra</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="nav">
    <button id="prev">← Trước</button>
    <button id="flip" class="primary">Lật thẻ</button>
    <button id="next">Tiếp →</button>
  </div>

  <div class="gesture-tip">Mẹo: Vuốt ngang trên thẻ để chuyển câu nhanh</div>
</main>

function normalize(str) {
  return str
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/[.,!?;:"]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function resetPractice() {
  const input = $('answerInput');
  const fb = $('feedback');
  input.value = '';
  input.className = '';
  input.style.height = 'auto';
  fb.textContent = '';
  fb.className = 'feedback';
}

function checkAnswer() {
  const input = $('answerInput');
  const fb = $('feedback');
  const userVal = input.value.trim();
  const correctVal = deck[index].en;

  if (!userVal) {
    fb.textContent = '⚠️ Bạn chưa nhập câu trả lời!';
    fb.className = 'feedback err';
    input.focus();
    return;
  }

  if (normalize(userVal) === normalize(correctVal)) {
    input.className = 'is-correct';
    fb.textContent = '✅ Chính xác! Làm tốt lắm.';
    fb.className = 'feedback ok';
    $('card').classList.add('flipped');
  } else {
    input.className = 'is-wrong';
    fb.innerHTML = `❌ Chưa đúng. Đáp án chuẩn:<br><strong>${correctVal}</strong>`;
    fb.className = 'feedback err';
    $('card').classList.add('flipped');
  }
}

function render() {
  if (!deck.length) return;
  const c = deck[index];
  $('vi').textContent = c.vi;
  $('en').textContent = c.en;
  $('ipa').textContent = c.ipa;
  $('card').classList.remove('flipped');
  $('counter').textContent = (index + 1) + ' / ' + deck.length;
  $('bar').style.width = ((index + 1) / deck.length * 100) + '%';
  $('unitLabel').textContent = c.unit.replace('UNIT 3: ', 'Unit 3 – ').replace('UNIT 4: ', 'Unit 4 – ');
  resetPractice();
}

function flip() { $('card').classList.toggle('flipped'); }
function move(n) { index = (index + n + deck.length) % deck.length; render(); }

function filter() {
  const v = $('unitFilter').value;
  deck = v === 'all' ? [...allCards] : allCards.filter(c => c.unit === v);
  index = 0;
  render();
}

$('card').addEventListener('click', flip);
$('flip').addEventListener('click', flip);
$('prev').addEventListener('click', () => move(-1));
$('next').addEventListener('click', () => move(1));
$('unitFilter').addEventListener('change', filter);
$('checkBtn').addEventListener('click', checkAnswer);

$('answerInput').addEventListener('input', autoResizeInput);
$('answerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    checkAnswer();
  }
});

$('shuffle').addEventListener('click', () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  render();
});

$('reset').addEventListener('click', () => {
  $('unitFilter').value = 'all';
  filter();
});

// Hỗ trợ vuốt cảm ứng (Swipe) trên điện thoại
let touchStartX = 0, touchStartY = 0;
const cardWrap = $('cardWrap');
cardWrap.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

cardWrap.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) move(1);  // Vuốt trái -> thẻ tiếp theo
    else move(-1);         // Vuốt phải -> thẻ trước
  }
}, { passive: true });

// Phím tắt cho máy tính
document.addEventListener('keydown', e => {
  if (document.activeElement === $('answerInput')) return;
  if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.code === 'Space' && !['BUTTON', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    flip();
  }
});

render();
</script>
</body>
</html>
